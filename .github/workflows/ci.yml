name: Validate TaskPilot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskpilot
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: taskpilot_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskpilot -d taskpilot_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TASKPILOT_TEST_DATABASE_URL: postgresql://taskpilot:synthetic-ci-only@127.0.0.1:5432/taskpilot_ci_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npm run secrets
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:integration
      - run: npm audit --audit-level=low
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with: { dotnet-version: "10.0.x" }
      - run: dotnet restore apps/windows/TaskPilot.Windows.csproj --locked-mode
      - run: dotnet build apps/windows/TaskPilot.Windows.csproj -c Release -p:Platform=x64 --no-restore
      - run: dotnet run --project apps/windows-tests/TaskPilot.ClientChecks.csproj -c Release
      - run: dotnet publish apps/windows/TaskPilot.Windows.csproj -c Release -p:Platform=x64 --no-restore -o work/publish-check
      - run: ./scripts/check-windows-package.ps1 -Path work/publish-check
